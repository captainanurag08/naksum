
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b14">
<title>This Site Is No Longer Active</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --cyan: #71e7ff;
    --purple: #a38aff;
    --text: #f5f7ff;
    --muted: #9ba6bd;
}

body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 22px;
    overflow: hidden;
    color: var(--text);
    font-family: "Segoe UI", Arial, sans-serif;
    background:
        radial-gradient(ellipse at 15% 15%, #17274b 0%, transparent 45%),
        radial-gradient(ellipse at 85% 85%, #291743 0%, transparent 42%),
        #080b14;
}

#stars {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

.glow {
    position: fixed;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    filter: blur(100px);
    opacity: .18;
    pointer-events: none;
    animation: glowMove 10s ease-in-out infinite alternate;
}

.glow-a {
    background: #44dfff;
    top: -130px;
    left: -100px;
}

.glow-b {
    background: #8852ff;
    bottom: -130px;
    right: -80px;
    animation-delay: -4s;
}

@keyframes glowMove {
    to { transform: translate(70px, 60px) scale(1.2); }
}

.scene {
    width: 100%;
    max-width: 720px;
    perspective: 1400px;
    z-index: 1;
}

.card {
    position: relative;
    text-align: center;
    padding: clamp(35px, 7vw, 72px) clamp(22px, 6vw, 65px);
    border-radius: 28px;
    border: 1px solid rgba(163, 190, 255, .19);
    background: linear-gradient(
        145deg,
        rgba(25, 36, 61, .88),
        rgba(12, 15, 29, .94)
    );
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    box-shadow:
        0 35px 90px rgba(0, 0, 0, .45),
        inset 0 1px rgba(255, 255, 255, .12),
        0 0 65px rgba(98, 220, 255, .05);
    transform-style: preserve-3d;
    animation: entrance 1s cubic-bezier(.2,.8,.2,1) both;
    transition: transform .2s ease;
}

.card::before {
    content: "";
    position: absolute;
    height: 1px;
    top: 0;
    left: 15%;
    width: 70%;
    background: linear-gradient(
        90deg, transparent, var(--cyan), var(--purple), transparent
    );
    box-shadow: 0 0 20px var(--cyan);
}

@keyframes entrance {
    from {
        opacity: 0;
        transform: translateY(35px) rotateX(8deg) scale(.96);
    }
    to {
        opacity: 1;
        transform: translateY(0) rotateX(0) scale(1);
    }
}

.badge {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 10px 15px;
    border-radius: 100px;
    border: 1px solid rgba(255, 160, 160, .23);
    background: rgba(255, 110, 130, .07);
    color: #ffb4c0;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    transform: translateZ(25px);
}

.badge-dot {
    width: 7px;
    height: 7px;
    background: #ff8296;
    border-radius: 50%;
    box-shadow: 0 0 12px #ff8296;
}

.icon-box {
    width: 108px;
    height: 108px;
    margin: 34px auto 32px;
    display: grid;
    place-items: center;
    border-radius: 29px;
    border: 1px solid rgba(120, 220, 255, .3);
    background: linear-gradient(145deg, #263a60, #11172b);
    box-shadow:
        12px 15px 25px rgba(0, 0, 0, .4),
        inset 2px 2px 7px rgba(255, 255, 255, .1),
        inset -3px -3px 8px rgba(0, 0, 0, .3),
        0 0 45px rgba(113, 231, 255, .1);
    transform: translateZ(55px);
    animation: float 4s ease-in-out infinite;
}

.icon-box svg {
    width: 53px;
    height: 53px;
    stroke: var(--cyan);
    filter: drop-shadow(0 0 10px rgba(113, 231, 255, .45));
}

@keyframes float {
    0%, 100% { transform: translateY(0) translateZ(55px); }
    50% { transform: translateY(-9px) translateZ(55px); }
}

h1 {
    font-size: clamp(31px, 5.5vw, 49px);
    font-weight: 750;
    letter-spacing: -1.8px;
    line-height: 1.17;
    margin-bottom: 22px;
    transform: translateZ(35px);
}

h1 span {
    display: block;
    margin-top: 7px;
    color: transparent;
    background: linear-gradient(100deg, #75e8ff, #b19aff);
    -webkit-background-clip: text;
    background-clip: text;
}

.description {
    max-width: 470px;
    margin: auto;
    color: var(--muted);
    font-size: 15px;
    line-height: 1.9;
    transform: translateZ(22px);
}

.description strong {
    color: #e0e7fa;
    font-weight: 600;
}

.divider {
    height: 3px;
    width: 65px;
    margin: 30px auto;
    border-radius: 20px;
    background: linear-gradient(90deg, var(--cyan), var(--purple));
    box-shadow: 0 0 16px rgba(113, 231, 255, .35);
}

.footer {
    color: #77829b;
    font-size: 11px;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    transform: translateZ(15px);
}

.footer span {
    color: #aab7d2;
}

@media (max-width: 480px) {
    body { padding: 15px; }
    .card { border-radius: 23px; }
    .icon-box {
        width: 92px;
        height: 92px;
        border-radius: 24px;
    }
    .icon-box svg {
        width: 46px;
        height: 46px;
    }
    .description { font-size: 14px; }
    .footer { font-size: 9px; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation: none !important;
        transition: none !important;
    }
}
</style>
</head>

<body>

<canvas id="stars" aria-hidden="true"></canvas>
<div class="glow glow-a"></div>
<div class="glow glow-b"></div>

<main class="scene">
    <section class="card" id="card">

        <div class="badge">
            <span class="badge-dot"></span>
            Project Closed
        </div>

        <div class="icon-box" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"
                 stroke-width="1.6"
                 stroke-linecap="round"
                 stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="14" rx="2"/>
                <path d="M8 22h8"/>
                <path d="M12 18v4"/>
                <path d="m9 9 6 5"/>
                <path d="m15 9-6 5"/>
            </svg>
        </div>

        <h1>
            This Site Is
            <span>No Longer Active</span>
        </h1>

        <p class="description">
            Hey! This website has been shut down.
            <br>
            That's all for this little project.
            <br><br>
            Thanks for stopping by and being part of
            this journey.
            <br><br>
            <strong>Take care! ✌️</strong>
        </p>

        <div class="divider"></div>

        <div class="footer">
            <span>End of the road</span> · Thanks for visiting
        </div>

    </section>
</main>

<script>
/* Floating stars */
const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");
let stars = [];
let w, h;
let frame;

function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth;
    h = window.innerHeight;

    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    stars = Array.from(
        { length: Math.min(70, Math.floor(w / 16)) },
        () => ({
            x: Math.random() * w,
            y: Math.random() * h,
            r: Math.random() * 1.4 + .3,
            speed: Math.random() * .25 + .08,
            alpha: Math.random() * .45 + .15
        })
    );
}

function animate() {
    ctx.clearRect(0, 0, w, h);

    stars.forEach(star => {
        star.y -= star.speed;

        if (star.y < 0) {
            star.y = h;
            star.x = Math.random() * w;
        }

        ctx.beginPath();
        ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(145, 218, 255, ${star.alpha})`;
        ctx.fill();
    });

    frame = requestAnimationFrame(animate);
}

const reducedMotion = window.matchMedia(
    "(prefers-reduced-motion: reduce)"
);

resize();

if (!reducedMotion.matches) {
    animate();
}

window.addEventListener("resize", resize);

/* Interactive 3D tilt for desktop */
const card = document.getElementById("card");

if (
    window.matchMedia("(hover: hover) and (pointer: fine)").matches &&
    !reducedMotion.matches
) {
    card.addEventListener("pointermove", event => {
        const rect = card.getBoundingClientRect();
        const x = (event.clientX - rect.left) / rect.width;
        const y = (event.clientY - rect.top) / rect.height;

        const rotateY = (x - .5) * 5;
        const rotateX = (.5 - y) * 5;

        card.style.transform =
            `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    });

    card.addEventListener("pointerleave", () => {
        card.style.transform = "rotateX(0deg) rotateY(0deg)";
    });
}
</script>

</body>
</html>
